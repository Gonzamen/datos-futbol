services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datos_futbol
      POSTGRES_PASSWORD: datos_futbol
      POSTGRES_DB: datos_futbol
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datos_futbol']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
